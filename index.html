<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Lode Runner - ZX Spectrum Clone</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; }
        body {
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: monospace;
            overflow: hidden;
        }
        #gameContainer {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }
        #gameCanvas {
            image-rendering: pixelated;
            border: 2px solid #444;
            max-width: 100vw;
        }
        #info {
            color: #0ff;
            font-size: 12px;
            text-align: center;
            padding: 5px;
        }
        #controls {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 512px;
            padding: 10px;
            gap: 20px;
        }
        #dpad {
            position: relative;
            width: 140px;
            height: 140px;
        }
        .dpad-btn {
            position: absolute;
            width: 45px;
            height: 45px;
            background: rgba(255,255,255,0.2);
            border: 2px solid rgba(255,255,255,0.4);
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 20px;
            user-select: none;
            -webkit-user-select: none;
        }
        .dpad-btn:active, .dpad-btn.active {
            background: rgba(0,255,0,0.4);
            border-color: #0f0;
        }
        #btn-up { top: 0; left: 50%; transform: translateX(-50%); }
        #btn-down { bottom: 0; left: 50%; transform: translateX(-50%); }
        #btn-left { left: 0; top: 50%; transform: translateY(-50%); }
        #btn-right { right: 0; top: 50%; transform: translateY(-50%); }
        
        #actionBtns {
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
        }
        .action-btn {
            width: 70px;
            height: 70px;
            background: rgba(255,200,0,0.3);
            border: 3px solid rgba(255,200,0,0.6);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ff0;
            font-size: 14px;
            font-weight: bold;
            user-select: none;
            -webkit-user-select: none;
        }
        .action-btn:active, .action-btn.active {
            background: rgba(255,200,0,0.6);
            border-color: #ff0;
        }
        #btn-dig { font-size: 16px; }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="768" height="576"></canvas>
        <div id="info">
            <span id="level">Level: 1</span> | 
            <span id="gold">Gold: 0/?</span> | 
            <span id="lives">Lives: 3</span>
        </div>
        <div style="color: #888; font-size: 10px; text-align: center; margin-top: 5px;">
            ⌨️ WASD/Стрелки: движение | ПРОБЕЛ/Z: копать | ESC: меню
        </div>
    </div>
    <div id="controls">
        <div id="dpad">
            <div class="dpad-btn" id="btn-up">▲</div>
            <div class="dpad-btn" id="btn-down">▼</div>
            <div class="dpad-btn" id="btn-left">◀</div>
            <div class="dpad-btn" id="btn-right">▶</div>
        </div>
        <div id="actionBtns">
            <div class="action-btn" id="btn-dig">DIG</div>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
